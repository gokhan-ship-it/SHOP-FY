  class KisiselKart extends HTMLElement {}

  KisiselKart.prototype.connectedCallback = function () {
    if (this._kuruldu) return;
    this._kuruldu = true;
    try {
      this.baslat();
    } catch (e) {
      // Herhangi bir hata: kart gizli kalır, sayfa bugünkü gibi çalışır
      this.hidden = true;
      if (window.console) console.warn('[kisisel] başlatılamadı:', e);
    }
  };

  KisiselKart.prototype.baslat = function () {
    var bolum = this.getAttribute('data-section-id');
    var veriEl = document.getElementById('KisiselVeri-' + bolum);
    if (!veriEl) throw new Error('Veri bulunamadı');
    this.model = new Model(JSON.parse(veriEl.textContent));
    this.yer = new Yerlesim(this.model);
    this.formId = this.getAttribute('data-form-id');
    this.bolum = bolum;
    this.depoAnahtari = 'kisisel-tasarim-' + this.model.urun.id;
    this.editor = new Editor(this);

    var kayitli = depoOku(this.depoAnahtari);
    this.tasarim = kayitli && kayitli.t && kayitli.v === 1 ? this.tasarimTemizle(kayitli.t) : null;
    this.mod = kayitli && kayitli.mod === 'kisisel' ? 'kisisel' : 'sade';

    var self = this;
    this.querySelectorAll('[data-kisisel-mod]').forEach(function (r) {
      r.checked = r.value === self.mod;
      r.addEventListener('change', function () {
        if (r.checked) self.modDegistir(r.value);
      });
    });
    this.querySelector('[data-kisisel-ac]').addEventListener('click', function () {
      self.editor.ac();
    });

    this.gonderYakala = this.gonderYakala.bind(this);
    document.addEventListener('submit', this.gonderYakala, true);

    this.hidden = false;
    this.modDegistir(this.mod, true);
  };

  // Kayıtlı tasarımdaki artık var olmayan parçaları ayıklar
  KisiselKart.prototype.tasarimTemizle = function (t) {
    var m = this.model;
    if (!t || !Array.isArray(t.parcalar)) return null;
    t.setId = m.set(t.setId).id;
    t.isim = typeof t.isim === 'string' ? t.isim : '';
    t.harfAyri = !!t.harfAyri && Array.isArray(t.harfKonumlari);
    if (t.harfAyri) {
      t.harfKonumlari = t.harfKonumlari.filter(function (k) {
        return Array.isArray(k) && isFinite(k[0]) && isFinite(k[1]);
      });
    } else {
      t.harfKonumlari = null;
    }
    t.parcalar = t.parcalar.filter(function (p) {
      if (p.tip === 'number') return !!m.rakamSeti();
      return p.tip === 'icon' && !!m.ikonHarita[p.urunId];
    });
    return t;
  };

  KisiselKart.prototype.modDegistir = function (mod, ilk) {
    this.mod = mod;
    this.querySelectorAll('[data-kisisel-mod]').forEach(function (r) {
      r.checked = r.value === mod;
      r.closest('label').classList.toggle('kp-secili', r.checked);
    });
    var govde = this.querySelector('[data-kisisel-govde]');
    govde.hidden = mod !== 'kisisel';
    document.body.classList.toggle('kisisel-modu', mod === 'kisisel');
    this.kaydet();
    this.guncelle();
    if (mod === 'kisisel' && !ilk && bosMu(this.tasarim)) this.editor.ac();
  };

  KisiselKart.prototype.kaydet = function () {
    depoYaz(this.depoAnahtari, { v: 1, mod: this.mod, t: this.tasarim });
  };

  KisiselKart.prototype.tasarimKaydet = function (t) {
    this.tasarim = bosMu(t) ? null : kopyala(t);
    this.kaydet();
    this.guncelle();
  };

  KisiselKart.prototype.guncelle = function () {
    var m = this.model;
    var t = this.tasarim;
    var bos = bosMu(t);
    var ozet = this.querySelector('[data-kisisel-ozet]');
    var toplam = this.querySelector('[data-kisisel-toplam]');
    var acButon = this.querySelector('[data-kisisel-ac]');
    this.querySelector('[data-kisisel-bos]').hidden = !bos;
    ozet.hidden = bos;
    toplam.hidden = bos;
    var indirimNotu = this.querySelector('[data-kisisel-indirim-notu]');
    if (indirimNotu) indirimNotu.hidden = bos;
    acButon.textContent = bos ? 'Tasarla' : 'Tasarımı düzenle';
    var f = null;
    if (!bos) {
      f = fiyatHesapla(m, this.yer, t);
      var parcalar = this.yer.parcalar(t);
      var maddeler = [];
      if (t.isim) maddeler.push(kacis(t.isim) + ' · ' + f.harfAdet + ' harf');
      var rakamlar = parcalar.filter(function (p) { return p.tip === 'number'; }).map(function (p) { return p.etiket; });
      if (rakamlar.length) maddeler.push(kacis(rakamlar.join(', ')) + ' · ' + rakamlar.length + ' rakam');
      var ikonlar = parcalar.filter(function (p) { return p.tip === 'icon'; }).map(function (p) { return p.etiket; });
      if (ikonlar.length) maddeler.push(kacis(ikonlar.join(', ')) + ' · ' + ikonlar.length + ' ikon');
      ozet.innerHTML = maddeler.map(function (x) { return '<li>' + x + '</li>'; }).join('');
      toplam.textContent = 'Toplam: ' + paraBicimle(f.toplam);
    }
    this.butonlariGuncelle(f);
    this.galeriGuncelle();
  };

  KisiselKart.prototype.gonderButonlari = function () {
    return [
      document.getElementById('ProductSubmitButton-' + this.bolum),
      document.getElementById('StickyProductSubmitButton-' + this.bolum)
    ].filter(Boolean);
  };

  KisiselKart.prototype.butonlariGuncelle = function (f) {
    var m = this.model;
    var kisisel = this.mod === 'kisisel';
    var bos = bosMu(this.tasarim);
    this.gonderButonlari().forEach(function (b) {
      var yazi = b.querySelector('span');
      if (!yazi) return;
      if (b._kpOrijinal == null) {
        b._kpOrijinal = yazi.textContent;
        b._kpOutline = b.classList.contains('btn-outline');
      }
      // "Hemen satın al" gizlendiğinde ana buton birincil görünsün
      if (b._kpOutline) {
        b.classList.toggle('btn-outline', !kisisel);
        b.classList.toggle('btn-primary', kisisel);
      }
      if (!kisisel) {
        yazi.textContent = b._kpOrijinal;
      } else if (bos) {
        yazi.textContent = 'Önce tasarımını yap';
      } else {
        yazi.textContent = 'Tasarımımla sepete ekle · ' + paraBicimle(f.toplam);
      }
    });
  };

  KisiselKart.prototype.galeriGuncelle = function () {
    var ilk = document.querySelector('#MainProduct-' + this.bolum + ' .main-carousel .splide__slide') ||
      document.querySelector('.main-carousel .splide__slide');
    if (!ilk) return;
    var katman = ilk.querySelector('.kp-galeri');
    var goster = this.mod === 'kisisel' && !bosMu(this.tasarim);
    if (!goster) {
      if (katman) katman.remove();
      return;
    }
    if (!katman) {
      katman = document.createElement('div');
      katman.className = 'kp-galeri';
      katman.innerHTML = '<div class="kp-galeri__sahne"></div><span class="kp-galeri__rozet">Senin tasarımın</span>';
      ilk.appendChild(katman);
      this.galeriSahne = new Sahne(this.model, this.yer, katman.querySelector('.kp-galeri__sahne'), { etkilesimli: false });
    }
    var t = kopyala(this.tasarim);
    var d = duzenle(this.model, this.yer, t);
    this.galeriSahne.ciz(d.parcalar, {}, false);
  };

  /* ---------------- Sepete ekleme ---------------- */

  KisiselKart.prototype.gonderYakala = function (e) {
    var form = e.target;
    // Dikkat: form.id kullanılamaz; formda name="id" alanı olduğu için o alanı döndürür.
    if (this.mod !== 'kisisel' || !form || !form.getAttribute || form.getAttribute('id') !== this.formId) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if (bosMu(this.tasarim)) {
      this.editor.ac();
      return;
    }
    this.sepeteEkle(form);
  };

  KisiselKart.prototype.adet = function () {
    var girdi = document.querySelector('input[name="quantity"][form="' + this.formId + '"]') ||
      document.querySelector('#Quantity-' + this.bolum);
    var n = girdi ? parseInt(girdi.value, 10) : 1;
    return n > 0 ? n : 1;
  };

  KisiselKart.prototype.hataGoster = function (mesaj) {
    var kutu = this.querySelector('[data-kisisel-hata]');
    if (!kutu) {
      kutu = document.createElement('p');
      kutu.className = 'kp-uyari kp-uyari--hata';
      kutu.setAttribute('role', 'alert');
      kutu.setAttribute('data-kisisel-hata', '');
      this.querySelector('[data-kisisel-govde]').appendChild(kutu);
    }
    kutu.hidden = !mesaj;
    kutu.textContent = mesaj || '';
  };

  KisiselKart.prototype.yukleniyor = function (acik) {
    this.gonderButonlari().forEach(function (b) {
      b.classList.toggle('loading', acik);
      b.setAttribute('aria-disabled', acik ? 'true' : 'false');
      var d = b.querySelector('.loading__spinner');
      if (d) d.classList.toggle('hidden', !acik);
    });
    this._yukleniyor = acik;
  };

  KisiselKart.prototype.sepetKalemleri = function (adet) {
    var m = this.model;
    var t = kopyala(this.tasarim);
    var d = duzenle(m, this.yer, t);
    var kimlik = tasarimKimligi();
    var ozet = tasarimOzeti(m, t);
    var alan = m.alanBul('letter') || m.alanlar[0];
    var ac = merkez(alan.sekil);
    var konum = {
      v: 1,
      alan: alan.id,
      p: d.parcalar.map(function (p) {
        var c = merkez(p.sekil);
        return {
          v: p.varyant ? p.varyant.id : null,
          t: p.tip.charAt(0),
          x: Math.round((c[0] - ac[0]) * 10) / 10,
          y: Math.round((c[1] - ac[1]) * 10) / 10
        };
      })
    };
    var bazOzellik = { 'Tasarım': ozet };
    if (t.isim) bazOzellik['İsim'] = t.isim;
    bazOzellik._tasarim_id = kimlik;
    bazOzellik._tasarim_rol = 'baz';
    bazOzellik._tasarim_konum = JSON.stringify(konum);

    // Aynı varyantları birleştir; harflerde isimdeki sırayı yaz
    var gruplar = {};
    var sira = [];
    var harfSirasi = 0;
    d.parcalar.forEach(function (p) {
      if (p.tip === 'letter') harfSirasi++;
      if (!p.varyant) return;
      var anahtar = String(p.varyant.id);
      if (!gruplar[anahtar]) {
        gruplar[anahtar] = { varyant: p.varyant, tip: p.tip, adet: 0, siralar: [] };
        sira.push(anahtar);
      }
      gruplar[anahtar].adet++;
      if (p.tip === 'letter') gruplar[anahtar].siralar.push(harfSirasi);
    });
    var kalemler = [{ id: m.urun.varyant, quantity: adet, properties: bazOzellik }];
    sira.forEach(function (a) {
      var g = gruplar[a];
      var ozellik = { 'Tasarım': ozet };
      if (g.tip === 'letter') ozellik['Harf sırası'] = g.siralar.join(', ');
      ozellik._tasarim_id = kimlik;
      ozellik._tasarim_rol = 'patch';
      ozellik._adet_birim = String(g.adet);
      kalemler.push({ id: g.varyant.id, quantity: g.adet * adet, properties: ozellik });
    });
    return { kimlik: kimlik, kalemler: kalemler, fiyat: fiyatHesapla(m, this.yer, t), hatalar: d.hatalar, tasarim: t };
  };

  KisiselKart.prototype.sepeteEkle = function () {
    var self = this;
    if (this._yukleniyor) return;
    var m = this.model;
    var adet = this.adet();
    var paket = this.sepetKalemleri(adet);
    if (Object.keys(paket.hatalar).length) {
      this.hataGoster('Tasarımında alana sığmayan bir parça var. Lütfen tasarımı düzenle.');
      this.editor.ac();
      return;
    }
    var stok = stokKontrol(m, paket.tasarim, this.yer, adet);
    if (stok.length) {
      var s = stok[0];
      this.hataGoster(
        (s.parca.tip === 'letter' ? s.parca.etiket + ' harfi' : s.parca.tip === 'number' ? s.parca.etiket + ' rakamı' : s.parca.etiket) +
        ' için stok yetersiz (' + s.mevcut + ' adet var, ' + s.gereken + ' gerekiyor).'
      );
      return;
    }
    this.hataGoster('');
    this.yukleniyor(true);

    var rotalar = window.routes || {};
    var ekleUrl = (rotalar.cart_add_url || '/cart/add') + '.js';
    var cizim = document.querySelector('cart-drawer');
    var govde = { items: paket.kalemler };
    if (cizim) {
      govde.sections = ['cart-drawer', 'cart-icon-bubble'];
      govde.sections_url = window.location.pathname;
    }

    fetch(ekleUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
      body: JSON.stringify(govde)
    })
      .then(function (r) {
        return r.json().then(function (j) {
          return { ok: r.ok, veri: j };
        });
      })
      .then(function (sonuc) {
        if (!sonuc.ok || sonuc.veri.status) {
          var mesaj = (sonuc.veri && (sonuc.veri.description || sonuc.veri.message)) || 'Sepete eklenemedi.';
          return self.yarimKalanlariTemizle(paket.kimlik).then(function () {
            throw new Error(mesaj);
          });
        }
        olayYayinla('tasarimla_sepete_eklendi', {
          urun_id: m.urun.id,
          tasarim_id: paket.kimlik,
          adet: adet,
          toplam: (paket.fiyat.toplam * adet) / 100,
          para_birimi: (window.Shopify && Shopify.currency && Shopify.currency.active) || 'TRY'
        });
        try {
          if (typeof publish === 'function' && typeof PUB_SUB_EVENTS !== 'undefined') {
            publish(PUB_SUB_EVENTS.cartUpdate, { source: 'kisisel-editor', productVariantId: m.urun.varyant, cartData: sonuc.veri });
          }
        } catch (e) {
          /* yoksay */
        }
        if (cizim && sonuc.veri.sections && sonuc.veri.sections['cart-drawer'] && typeof cizim.renderContents === 'function') {
          cizim.renderContents({ id: m.urun.varyant, sections: sonuc.veri.sections });
          // Temanın product-form.js'i gibi: boş sepet işaretini kaldır (yoksa çekmecenin odak tutması hata verir)
          cizim.classList.remove('is-empty');
        } else {
          window.location.href = rotalar.cart_url || '/cart';
        }
      })
      .catch(function (err) {
        self.hataGoster(err.message || 'Sepete eklenemedi. Lütfen tekrar dene.');
      })
      .then(function () {
        self.yukleniyor(false);
      });
  };

  // Hata durumunda sepete kısmen eklenmiş kalemleri geri alır
  KisiselKart.prototype.yarimKalanlariTemizle = function (kimlik) {
    var rotalar = window.routes || {};
    return fetch((rotalar.cart_url || '/cart') + '.js', { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (sepet) {
        var guncelle = {};
        (sepet.items || []).forEach(function (k) {
          if (k.properties && k.properties._tasarim_id === kimlik) guncelle[k.key] = 0;
        });
        if (!Object.keys(guncelle).length) return;
        return fetch((rotalar.cart_update_url || '/cart/update') + '.js', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ updates: guncelle })
        });
      })
      .catch(function () {});
  };

  customElements.define('kisisel-kart', KisiselKart);

  // Test ve hata ayıklama için iç fonksiyonlar
  window.KisiselEditorIc = {
    Model: Model,
    Yerlesim: Yerlesim,
    isimAnaliz: isimAnaliz,
    duzenle: duzenle,
    harfleriAyir: harfleriAyir,
    harfleriBirlestir: harfleriBirlestir,
    fiyatHesapla: fiyatHesapla,
    tasarimOzeti: tasarimOzeti,
    paraBicimle: paraBicimle,
    buyukHarf: buyukHarf,
    geometri: { icinde: icinde, cakisir: cakisir, noktaIcinde: noktaIcinde }
  };
})();
</script>
<script>/*
 * JantiFox kişiselleştirme: sepette tasarım gruplaması
 * - Aynı _tasarim_id'yi taşıyan kalemleri sepet çekmecesinde ve sepet sayfasında grup olarak gösterir.
 * - Çanta (baz kalem) silinirse onay sorar ve grubun tamamını siler.
 * - Tek bir patch silinirse uyarır, siler ve çanta kalemindeki tasarım özetini günceller.
 * - Çanta adedi değişirse patch adetlerini aynı oranda değiştirir.
 * Tasarım kalemi olmayan sepetlerde hiçbir şey yapmaz.
 */
(function () {
  'use strict';

  if (window.KisiselSepet) return;

  var rotalar = function () {
    var r = window.routes || {};
    return {
      sepet: r.cart_url || '/cart',
      guncelle: (r.cart_update_url || '/cart/update') + '.js',
      degistir: (r.cart_change_url || '/cart/change') + '.js'
    };
  };

  var sonSepet = null;
  var calisiyor = false;
  var tekrar = false;

  function sepetGetir() {
    return fetch(rotalar().sepet + '.js', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        sonSepet = s;
        return s;
      });
  }

  function satirlar() {
    return Array.prototype.slice.call(
      document.querySelectorAll('.cart-item[id^="CartDrawer-Item-"], .cart-item[id^="CartItem-"]')
    );
  }

  function satirNo(satir) {
    return parseInt(satir.id.split('-').pop(), 10);
  }

  function sadeAd(baslik) {
    return String(baslik || '').replace(/\s*patch\s*$/i, '').trim();
  }

  // Grubun kalan kalemlerinden tasarım özetini yeniden üretir
  function ozetUret(kalemler) {
    var harfler = [];
    var digerleri = [];
    kalemler.forEach(function (k) {
      var o = k.properties || {};
      if (o._tasarim_rol !== 'patch') return;
      if (o['Harf sırası']) {
        String(o['Harf sırası']).split(',').forEach(function (s) {
          harfler.push({ sira: parseInt(s, 10), harf: k.variant_title || '' });
        });
      } else {
        var birim = parseInt(o._adet_birim, 10) || 1;
        var ad = k.variant_title && k.variant_title !== 'Default Title' ? k.variant_title : sadeAd(k.product_title);
        for (var i = 0; i < birim; i++) digerleri.push(ad);
      }
    });
    harfler.sort(function (a, b) { return a.sira - b.sira; });
    var isim = harfler.map(function (h) { return h.harf; }).join('');
    return { isim: isim, ozet: [isim].concat(digerleri).filter(Boolean).join(' + ') };
  }

  function gruplar(sepet) {
    var g = {};
    (sepet.items || []).forEach(function (k, i) {
      var o = k.properties || {};
      if (!o._tasarim_id) return;
      if (!g[o._tasarim_id]) g[o._tasarim_id] = { baz: null, patchler: [] };
      k._satir = i + 1;
      if (o._tasarim_rol === 'baz') g[o._tasarim_id].baz = k;
      else g[o._tasarim_id].patchler.push(k);
    });
    return g;
  }

  /* ---------------- Görünüm ---------------- */

  function isaretle() {
    if (calisiyor) {
      tekrar = true;
      return;
    }
    var mevcut = satirlar();
    // Görünür "Tasarım" özelliği olan satır yoksa sepeti hiç sorgulama
    var adayVar = mevcut.some(function (s) { return s.textContent.indexOf('Tasarım') !== -1; });
    if (!adayVar) return;
    calisiyor = true;
    sepetGetir()
      .then(function (sepet) {
        var kalemler = sepet.items || [];
        var tasarimVar = kalemler.some(function (k) { return k.properties && k.properties._tasarim_id; });
        if (!tasarimVar) return;
        var kapsayicilar = [];
        satirlar().forEach(function (satir) {
          var k = kalemler[satirNo(satir) - 1];
          var o = (k && k.properties) || {};
          if (!o._tasarim_id) {
            satir.classList.remove('kp-sepet-baz', 'kp-sepet-patch');
            satir.removeAttribute('data-kp-tasarim');
            return;
          }
          satir.setAttribute('data-kp-tasarim', o._tasarim_id);
          satir.setAttribute('data-kp-rol', o._tasarim_rol === 'baz' ? 'baz' : 'patch');
          satir.classList.toggle('kp-sepet-baz', o._tasarim_rol === 'baz');
          satir.classList.toggle('kp-sepet-patch', o._tasarim_rol !== 'baz');
          if (kapsayicilar.indexOf(satir.parentNode) === -1) kapsayicilar.push(satir.parentNode);
        });
        // Patch satırlarını kendi çantalarının hemen altına taşı (yalnızca sıra yanlışsa)
        kapsayicilar.forEach(function (kap) {
          var bazlar = kap.querySelectorAll(':scope > [data-kp-rol="baz"]');
          Array.prototype.forEach.call(bazlar, function (baz) {
            var id = baz.getAttribute('data-kp-tasarim');
            var onceki = baz;
            Array.prototype.forEach.call(kap.querySelectorAll(':scope > [data-kp-rol="patch"]'), function (p) {
              if (p.getAttribute('data-kp-tasarim') !== id) return;
              if (onceki.nextElementSibling !== p) onceki.after(p);
              onceki = p;
            });
            Array.prototype.forEach.call(kap.querySelectorAll(':scope > [data-kp-tasarim="' + id + '"]'), function (s) {
              s.classList.remove('kp-sepet-son');
            });
            onceki.classList.add('kp-sepet-son');
            if (!baz.querySelector('.kp-sepet-rozet')) {
              var ad = baz.querySelector('.cart-item__name');
              if (ad) {
                var rozet = document.createElement('span');
                rozet.className = 'kp-sepet-rozet';
                rozet.textContent = 'Kişiselleştirilmiş';
                ad.insertAdjacentElement('beforebegin', rozet);
              }
            }
          });
        });
      })
      .catch(function () {})
      .then(function () {
        calisiyor = false;
        if (tekrar) {
          tekrar = false;
          isaretle();
        }
      });
  }

  /* ---------------- Sepet güncelleme ---------------- */

  function yenidenCiz() {
    if (/\/cart\/?$/.test(window.location.pathname)) {
      window.location.reload();
      return;
    }
    try {
      if (typeof publish === 'function' && typeof PUB_SUB_EVENTS !== 'undefined') {
        publish(PUB_SUB_EVENTS.cartUpdate, { source: 'kisisel-sepet' });
      }
    } catch (e) {
      /* yoksay */
    }
    fetch(window.location.pathname + '?sections=cart-icon-bubble')
      .then(function (r) { return r.json(); })
      .then(function (b) {
        var el = document.getElementById('cart-icon-bubble');
        if (el && b['cart-icon-bubble']) {
          var dom = new DOMParser().parseFromString(b['cart-icon-bubble'], 'text/html').querySelector('.shopify-section');
          if (dom) el.innerHTML = dom.innerHTML;
        }
      })
      .catch(function () {});
  }

  function postJson(url, govde) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(govde)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.status) throw new Error(j.description || j.message || 'Sepet güncellenemedi.');
        return j;
      });
    });
  }

  function hataBildir(mesaj) {
    window.alert(mesaj);
  }

  function grupSil(grup) {
    var guncelle = {};
    if (grup.baz) guncelle[grup.baz.key] = 0;
    grup.patchler.forEach(function (p) { guncelle[p.key] = 0; });
    return postJson(rotalar().guncelle, { updates: guncelle });
  }

  function patchSil(grup, patch) {
    return postJson(rotalar().guncelle, { updates: (function () { var u = {}; u[patch.key] = 0; return u; })() }).then(function () {
      if (!grup.baz) return;
      var kalan = grup.patchler.filter(function (p) { return p.key !== patch.key; });
      var yeni = ozetUret(kalan);
      var ozellik = {};
      Object.keys(grup.baz.properties || {}).forEach(function (a) { ozellik[a] = grup.baz.properties[a]; });
      if (!kalan.length) {
        // Tasarımda hiç patch kalmadı: çanta düz çanta olarak kalır
        delete ozellik['Tasarım'];
        delete ozellik['İsim'];
        delete ozellik._tasarim_konum;
        ozellik._tasarim_rol = 'baz';
      } else {
        ozellik['Tasarım'] = yeni.ozet;
        if (yeni.isim) ozellik['İsim'] = yeni.isim;
        else delete ozellik['İsim'];
        try {
          var konum = JSON.parse(ozellik._tasarim_konum || '{}');
          if (konum.p) {
            var silinecek = parseInt(patch.properties._adet_birim, 10) || 1;
            konum.p = konum.p.filter(function (x) {
              if (String(x.v) === String(patch.variant_id) && silinecek > 0) {
                silinecek--;
                return false;
              }
              return true;
            });
            ozellik._tasarim_konum = JSON.stringify(konum);
          }
        } catch (e) {
          /* konum bozuksa olduğu gibi kalsın */
        }
      }
      return sepetGetir().then(function (sepet) {
        var baz = (sepet.items || []).filter(function (k) { return k.key === grup.baz.key; })[0];
        if (!baz) return;
        return postJson(rotalar().degistir, { id: baz.key, quantity: baz.quantity, properties: ozellik });
      });
    });
  }

  function adetDegistir(grup, yeniAdet) {
    var guncelle = {};
    guncelle[grup.baz.key] = yeniAdet;
    grup.patchler.forEach(function (p) {
      var birim = parseInt(p.properties._adet_birim, 10) || Math.round(p.quantity / Math.max(1, grup.baz.quantity)) || 1;
      guncelle[p.key] = birim * yeniAdet;
    });
    return postJson(rotalar().guncelle, { updates: guncelle });
  }

  function grupBul(satir) {
    var id = satir.getAttribute('data-kp-tasarim');
    if (!id || !sonSepet) return null;
    var g = gruplar(sonSepet)[id];
    if (!g) return null;
    var kalem = sonSepet.items[satirNo(satir) - 1];
    return { grup: g, kalem: kalem };
  }

  function islem(soz) {
    document.documentElement.classList.add('kp-sepet-mesgul');
    return soz
      .catch(function (e) {
        hataBildir(e.message || 'Sepet güncellenemedi.');
      })
      .then(function () {
        document.documentElement.classList.remove('kp-sepet-mesgul');
        yenidenCiz();
      });
  }

  // Sil butonu (tema dinleyicisinden önce yakalanır)
  document.addEventListener(
    'click',
    function (e) {
      var buton = e.target.closest && e.target.closest('cart-remove-button, .cart-remove-button');
      if (!buton) return;
      var satir = buton.closest('[data-kp-tasarim]');
      if (!satir) return;
      var bilgi = grupBul(satir);
      if (!bilgi || !bilgi.kalem) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      if (satir.getAttribute('data-kp-rol') === 'baz') {
        if (!window.confirm('Çantayı silersen bu tasarıma ait tüm patch\'ler de sepetten çıkar. Devam edilsin mi?')) return;
        islem(grupSil(bilgi.grup));
      } else {
        if (!window.confirm('Bu patch\'i silersen tasarımın değişecek. Devam edilsin mi?')) return;
        islem(patchSil(bilgi.grup, bilgi.kalem));
      }
    },
    true
  );

  // Adet değişikliği (tema dinleyicisinden önce yakalanır)
  document.addEventListener(
    'change',
    function (e) {
      var girdi = e.target;
      if (!girdi.matches || !girdi.matches('input[name="updates[]"], .quantity__input')) return;
      var satir = girdi.closest('[data-kp-tasarim]');
      if (!satir) return;
      var bilgi = grupBul(satir);
      if (!bilgi || !bilgi.kalem) return;
      e.stopImmediatePropagation();
      var yeni = parseInt(girdi.value, 10);
      if (satir.getAttribute('data-kp-rol') !== 'baz') {
        // Patch adetleri çantaya bağlıdır; doğrudan değiştirilemez
        girdi.value = bilgi.kalem.quantity;
        return;
      }
      if (!(yeni >= 0) || yeni === bilgi.kalem.quantity) {
        girdi.value = bilgi.kalem.quantity;
        return;
      }
      if (yeni === 0) {
        if (!window.confirm('Çantayı silersen bu tasarıma ait tüm patch\'ler de sepetten çıkar. Devam edilsin mi?')) {
          girdi.value = bilgi.kalem.quantity;
          return;
        }
        islem(grupSil(bilgi.grup));
        return;
      }
      islem(adetDegistir(bilgi.grup, yeni));
    },
    true
  );

  // Sepet içeriği her yeniden çizildiğinde grupları işaretle
  var bekleyen = null;
  function planla() {
    if (bekleyen) return;
    bekleyen = setTimeout(function () {
      bekleyen = null;
      isaretle();
    }, 60);
  }
  function gozle() {
    var hedefler = [document.querySelector('cart-drawer'), document.querySelector('cart-items')].filter(Boolean);
    hedefler.forEach(function (h) {
      new MutationObserver(function (kayitlar) {
        var ilgili = kayitlar.some(function (k) {
          return Array.prototype.some.call(k.addedNodes, function (n) {
            return n.nodeType === 1 && (n.matches('.cart-item, cart-drawer-items, .drawer__inner, .js-contents') || n.querySelector('.cart-item'));
          });
        });
        if (ilgili) planla();
      }).observe(h, { childList: true, subtree: true });
    });
    planla();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', gozle);
  else gozle();

  window.KisiselSepet = { ozetUret: ozetUret, yenile: isaretle };
})();
</script>
