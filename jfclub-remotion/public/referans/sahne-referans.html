<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=240">
<title>JantiFox Club sahne referansi</title>
<!--
  REFERANS SAHNE (onaylı taslak). 240x240 px'te çizildi; videoda 720x720'ye x3 ölçeklenecek.
  Durumlar: ?durum=kapali | sallanma | acilis | acik
  Bu dosyadaki CSS animasyonları sadece referanstır. Remotion'da CSS animasyonu kullanılmaz;
  her hareket useCurrentFrame + interpolate/spring ile kare bazlı yazılmalıdır.
-->
<style>
  :root{
    --red:#bc0027; --red-2:#d4002f; --red-deep:#6a0016;
    --orange:#ff501b; --cream:#fbead6; --cream-2:#f1d6b6; --burgundy:#59001c;
    --ink:#202223; --muted:#6b5a52; --page:#efe9e2;
  }

  *{box-sizing:border-box}
  html,body{margin:0;background:#fbead6}
  /* ---------- Stage + 3D box ---------- */
  .stage{position:relative;height:232px;margin:2px -18px 0}
  .vlabel{display:none;position:absolute;right:26px;bottom:6px;font-size:10px;font-weight:600;color:var(--orange);background:#fff;padding:3px 8px;border-radius:6px;z-index:9}
  .show-video .stage{outline:2px dashed var(--orange);outline-offset:-6px;border-radius:16px}
  .show-video .vlabel{display:block}
  .rays,.glow,.floor,.scene{pointer-events:none}
  .floor{position:absolute;left:50%;top:200px;width:160px;height:24px;margin-left:-80px;border-radius:50%;background:radial-gradient(closest-side,rgba(89,0,28,.28),rgba(89,0,28,0))}
  .rays{position:absolute;left:50%;top:62px;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,201,74,.55) 0deg 7deg,rgba(255,201,74,0) 7deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 66%);mask-image:radial-gradient(circle,#000 18%,transparent 66%);opacity:0;transform:scale(.3)}
  .glow{position:absolute;left:50%;top:62px;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,236,200,.4) 45%,rgba(255,236,200,0) 70%);opacity:0;transform:scale(.4)}
  .scene{position:absolute;left:50%;top:134px;width:0;height:0;perspective:760px;perspective-origin:50% -40px;scale:.86}
  .wiggle{position:absolute;transform-style:preserve-3d}
  .box3d{position:absolute;transform-style:preserve-3d;transform:rotateX(-21deg) rotateY(-33deg)}
  .f{position:absolute;left:-60px;top:-60px;width:120px;height:120px}
  /* box faces — centred cross ribbon; on the logo face it stays on the lid and does not run down the box */
  .box3d{--rib:#f8e2c7;--edge:rgba(89,0,28,.16)}
  .f.front{transform:translateZ(60px);background:linear-gradient(165deg,#e3123f 0%,var(--red-2) 35%,#a8001f 100%);box-shadow:inset 0 -14px 20px rgba(0,0,0,.12)}
  .f.front img{position:absolute;left:21px;top:24px;width:78px;height:78px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
  .f.right{transform:rotateY(90deg) translateZ(60px);background:
      linear-gradient(90deg,transparent 0 50px,var(--edge) 50px 51px,var(--rib) 51px 69px,var(--edge) 69px 70px,transparent 70px),
      linear-gradient(170deg,#a80022,#7c001a)}
  .f.right::after{content:"";position:absolute;left:51px;top:0;width:18px;height:100%;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.2))}
  .f.left{transform:rotateY(-90deg) translateZ(60px);background:linear-gradient(90deg,transparent 0 51px,#d9bf9f 51px 69px,transparent 69px),#5c0013}
  .f.back{transform:rotateY(180deg) translateZ(60px);background:linear-gradient(90deg,transparent 0 51px,#c9a98a 51px 69px,transparent 69px),var(--red-deep)}
  .f.bottom{transform:rotateX(-90deg) translateZ(60px);background:#4a000f}

  .lid{position:absolute;transform-style:preserve-3d;transform:translateY(-74px)}
  .l{position:absolute;left:-66px;top:-14px;width:132px;height:28px}
  .l.lfront{transform:translateZ(66px);background:
      linear-gradient(90deg,transparent 0 56px,var(--edge) 56px 57px,var(--rib) 57px 75px,var(--edge) 75px 76px,transparent 76px),
      linear-gradient(180deg,#f0254f,#c4002a)}
  .l.lright{transform:rotateY(90deg) translateZ(66px);background:
      linear-gradient(90deg,transparent 0 56px,var(--edge) 56px 57px,var(--rib) 57px 75px,var(--edge) 75px 76px,transparent 76px),
      linear-gradient(180deg,#bf0029,#92001f)}
  .l.lback{transform:rotateY(180deg) translateZ(66px);background:linear-gradient(90deg,transparent 0 57px,#e3c7a6 57px 75px,transparent 75px),#8a001d}
  .l.lleft{transform:rotateY(-90deg) translateZ(66px);background:linear-gradient(90deg,transparent 0 57px,#e3c7a6 57px 75px,transparent 75px),#8a001d}
  .l.ltop{left:-66px;top:-66px;width:132px;height:132px;transform:rotateX(90deg) translateZ(14px);background:
      linear-gradient(90deg,transparent 0 56px,var(--edge) 56px 57px,var(--rib) 57px 75px,var(--edge) 75px 76px,transparent 76px),
      linear-gradient(0deg,transparent 0 56px,var(--edge) 56px 57px,var(--rib) 57px 75px,var(--edge) 75px 76px,transparent 76px),
      radial-gradient(circle at 30% 30%,#ff3a62,#d1002d 70%)}
  .l.lbottom{left:-66px;top:-66px;width:132px;height:132px;transform:rotateX(-90deg) translateZ(14px);background:#5c0013}
  /* four-loop bow at the centre of the lid */
  .bow{position:absolute;left:-42px;top:-50px;width:84px;height:40px;filter:drop-shadow(0 2px 2px rgba(89,0,28,.3))}
  .bow i{position:absolute;bottom:4px;width:42px;height:31px;border-radius:55% 45% 45% 55%/60% 60% 40% 40%;background:radial-gradient(circle at 65% 35%,#fffaf2,var(--rib) 50%,#ecc9a2);border:1.5px solid #e2bf97}
  .bow i:nth-child(1){left:1px;transform:rotate(-16deg)}
  .bow i:nth-child(2){right:1px;transform:scaleX(-1) rotate(-16deg)}
  .bow b{position:absolute;left:33px;bottom:2px;width:18px;height:19px;border-radius:7px;background:#f0d2ae;border:1.5px solid #ddb98f}
  .bow.side{transform:rotateY(90deg)}
  .bow.side i{height:27px;width:38px}
  .bow.side i:nth-child(1){left:5px}
  .bow.side i:nth-child(2){right:5px}

  .fox{position:absolute;left:-48px;top:-48px;width:96px;height:96px;opacity:0;transform:translateY(8px) rotateY(33deg) rotateX(21deg) scale(.7);filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 6px 6px rgba(89,0,28,.25))}

  /* idle shake */
  .shake .wiggle{animation:shake 2.4s ease-in-out infinite}
  .shake .lid{animation:lidHop 2.4s ease-in-out infinite}
  .shake .floor{animation:floor 2.4s ease-in-out infinite}
  @keyframes shake{0%,46%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-7deg)}56%{transform:translateY(-10px) rotate(6deg)}62%{transform:translateY(-6px) rotate(-5deg)}68%{transform:translateY(-3px) rotate(3deg)}74%{transform:translateY(0) rotate(0)}}
  @keyframes lidHop{0%,46%,100%{transform:translateY(-74px) rotate(0)}52%{transform:translateY(-84px) rotate(-4deg)}58%{transform:translateY(-80px) rotate(5deg)}64%{transform:translateY(-83px) rotate(-3deg)}72%{transform:translateY(-74px) rotate(0)}}
  @keyframes floor{0%,46%,100%{transform:scale(1);opacity:1}56%{transform:scale(.82);opacity:.7}74%{transform:scale(1);opacity:1}}

  /* opening */
  .open .wiggle{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
  .open .lid{animation:lidOff 1s cubic-bezier(.25,.9,.3,1) forwards}
  .open .fox{animation:foxUp 1s .28s cubic-bezier(.2,1.35,.4,1) forwards,foxBob 2.8s 1.35s ease-in-out infinite}
  .open .rays{animation:raysIn .7s .25s ease-out forwards,spin 16s linear infinite}
  .open .glow{animation:glowIn .9s .2s ease-out forwards}
  /* already-open (second phone) */
  .opened .lid{display:none}
  .opened .fox{opacity:1;transform:translateY(-88px) rotateY(33deg) rotateX(21deg);animation:foxBob 2.8s ease-in-out infinite}
  .opened .rays{opacity:1;transform:scale(1);animation:spin 16s linear infinite}
  .opened .glow{opacity:.75;transform:none}
  @keyframes pop{0%{transform:scale(1,1)}30%{transform:scale(1.08,.88)}60%{transform:scale(.96,1.06)}100%{transform:scale(1,1)}}
  @keyframes lidOff{0%{transform:translateY(-74px)}25%{transform:translateY(-120px) rotateZ(-10deg)}100%{transform:translate3d(-270px,-340px,40px) rotateZ(-48deg) rotateX(55deg)}}
  @keyframes foxUp{0%{opacity:0;transform:translateY(8px) rotateY(33deg) rotateX(21deg) scale(.7)}12%{opacity:1}60%{opacity:1;transform:translateY(-96px) rotateY(33deg) rotateX(21deg) scale(1.06)}80%{opacity:1;transform:translateY(-82px) rotateY(33deg) rotateX(21deg) scale(.98)}100%{opacity:1;transform:translateY(-88px) rotateY(33deg) rotateX(21deg) scale(1)}}
  @keyframes foxBob{0%,100%{opacity:1;transform:translateY(-88px) rotateY(33deg) rotateX(21deg) rotateZ(0)}50%{opacity:1;transform:translateY(-95px) rotateY(33deg) rotateX(21deg) rotateZ(-4deg)}}
  @keyframes raysIn{to{opacity:1;transform:scale(1)}}
  @keyframes spin{to{rotate:360deg}}
  @keyframes glowIn{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.1)}100%{opacity:.75;transform:scale(1)}}

  .confetti{position:absolute;left:50%;top:104px;width:0;height:0;z-index:2;pointer-events:none}
  .confetti span{position:absolute;left:-5px;top:-5px;width:10px;height:10px;opacity:0;animation:burst var(--d) cubic-bezier(.15,.7,.4,1) var(--delay) forwards}
  .c-dot{border-radius:50%}
  .c-star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .c-heart{clip-path:path('M5 9 L1 5 C-1 3 0 0 2.6 0 C4 0 5 1.2 5 1.2 C5 1.2 6 0 7.4 0 C10 0 11 3 9 5 Z')}
  .c-rect{width:6px!important;height:12px!important;border-radius:2px}
  @keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}45%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}100%{opacity:0;transform:translate(calc(var(--x) * 1.25),calc(var(--y) + 150px)) rotate(calc(var(--r) * 2)) scale(.9)}}

  /* 240x240 kare sahne için konumlar */
  .stage{position:relative;width:240px;height:240px;margin:0;overflow:hidden;background:#fbead6}
  .scene{top:138px}
  .rays,.glow{top:66px}
  .floor{top:204px}
  .confetti{top:108px}
</style></head>

<script>
(function(){
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
  const stage=document.getElementById('stage'), confetti=document.getElementById('confetti');
  function burst(){
    confetti.innerHTML='';
    const colors=['#bc0027','#ff501b','#ffc94a','#59001c','#fbead6','#ffffff'];
    const shapes=['c-dot','c-star','c-heart','c-rect','c-star','c-dot'];
    for(let i=0;i<26;i++){
      const s=document.createElement('span'); s.className=shapes[i%shapes.length];
      const ang=(-155+rnd()*130)*Math.PI/180, dist=60+rnd()*80;
      s.style.setProperty('--x',(Math.cos(ang)*dist).toFixed(0)+'px');
      s.style.setProperty('--y',(Math.sin(ang)*dist-10).toFixed(0)+'px');
      s.style.setProperty('--r',(rnd()*540-270).toFixed(0)+'deg');
      s.style.setProperty('--d',(1.2+rnd()*.6).toFixed(2)+'s');
      s.style.setProperty('--delay',(.22+rnd()*.15).toFixed(2)+'s');
      const c=colors[i%colors.length]; s.style.background=c;
      if(c==='#ffffff'||c==='#fbead6') s.style.boxShadow='0 0 0 1px rgba(89,0,28,.15)';
      confetti.appendChild(s);
    }
  }
  window.setDurum=function(d){
    stage.className='stage'; confetti.innerHTML=''; void stage.offsetWidth;
    if(d==='sallanma') stage.classList.add('shake');
    if(d==='acilis'){ stage.classList.add('open'); burst(); }
    if(d==='acik') stage.classList.add('opened');
  };
  const p=new URLSearchParams(location.search).get('durum')||'sallanma';
  window.setDurum(p);
})();
</script>
